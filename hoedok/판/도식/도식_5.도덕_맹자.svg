    <text x="92" y="502" font-size="15">상지 : 뜻을 고상하게 – 마음 보존</text>
    <text x="92" y="530" font-size="15">지지 : 본성을 유지 – 본성 함양</text>
    <text x="290" y="446">왕도 : 덕을 통한 정치</text>
    <text x="290" y="474">교육 &gt; 선정 : 본성 회복을 위한 교육이 최우선</text>
