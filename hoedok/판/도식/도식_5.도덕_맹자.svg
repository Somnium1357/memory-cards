  <g fill="currentColor" font-size="16">
    <g text-anchor="middle">
      <text x="260" y="34">천 <tspan font-size="14">(=선을 향하니 선함)</tspan></text>
      <text x="260" y="76">성선 <tspan font-size="14">(사람 안에 천이 있으니 성도 선함)</tspan></text>
      <text x="260" y="118">불인인지심 <tspan font-size="14">(성선의 증거)</tspan></text>
