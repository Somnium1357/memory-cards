<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 480 546" width="480" height="546">
  <!-- 10-01 맞춤(판 도덕): 동하 「맹자 도식 글자가 매우 작다」 — 폭 576 그림이 순자와 나란한 반 칸(≈460)에 줄어 글자 11~12px
       → 같은 내용·같은 모양(위→아래 사슬 · 사단 넷 · 수양/정치 두 갈래)을 폭 480 으로 다시 짬(가운데 사슬을 좁히고 아래 두 갈래 글을 두 줄로)
       · 노트(백지인출 p11)의 「인의의 실현 ⇐ [ 상지 / 지지」 묶음을 괄호로 · 글자 무변
       · 판 도식 정본 형식: <style> 없음 · 색 전부 currentColor -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="240" y1="40" x2="240" y2="56"/>
    <line x1="240" y1="82" x2="240" y2="98"/>
    <line x1="240" y1="124" x2="240" y2="140"/>
    <line x1="220" y1="166" x2="194" y2="188"/>
    <line x1="260" y1="166" x2="286" y2="188"/>
    <line x1="240" y1="318" x2="240" y2="336"/>
    <line x1="212" y1="368" x2="126" y2="392"/>
    <line x1="268" y1="368" x2="354" y2="392"/>
    <!-- 인의의 실현 ⇐ [ 상지 / 지지 -->
    <path d="M30 478 L24 478 L24 552 L30 552"/>
  </g>
  <g fill="currentColor">
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(240,58) rotate(90)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(240,100) rotate(90)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(240,142) rotate(90)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(194,188) rotate(140)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(286,188) rotate(40)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(240,338) rotate(90)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(126,392) rotate(164)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(354,392) rotate(16)"/>
  </g>
  <g fill="currentColor" font-size="16">
    <g text-anchor="middle">
      <text x="240" y="32">천 <tspan font-size="14">(=선을 향하니 선함)</tspan></text>
      <text x="240" y="74">성선 <tspan font-size="14">(사람 안에 천이 있으니 성도 선함)</tspan></text>
      <text x="240" y="116">불인인지심 <tspan font-size="14">(성선의 증거)</tspan></text>
      <text x="240" y="158">사단과 사덕</text>
      <text x="186" y="214">측은</text>
      <text x="186" y="246">수오</text>
      <text x="186" y="278">사양</text>
      <text x="186" y="310">시비</text>
      <text x="228" y="214">→</text>
      <text x="228" y="246">→</text>
      <text x="228" y="278">→</text>
      <text x="228" y="310">→</text>
      <text x="240" y="362">사단을 갖춰 사덕을 완성</text>
      <text x="118" y="414" font-weight="600">수양 (내적)</text>
      <text x="362" y="414" font-weight="600">정치 (외부)</text>
    </g>
    <text x="250" y="214">인 <tspan font-size="14">(사랑)</tspan></text>
    <text x="250" y="246">의 <tspan font-size="14">(정의)</tspan></text>
    <text x="250" y="278">예 <tspan font-size="14">(예의)</tspan></text>
    <text x="250" y="310">지 <tspan font-size="14">(지혜)</tspan></text>
    <g font-size="15">
      <text x="4" y="446">호연지기, 과욕</text>
      <text x="4" y="470">인의의 실현</text>
      <text x="36" y="492">상지 : 뜻을 고상하게</text>
      <text x="52" y="512">– 마음 보존</text>
      <text x="36" y="534">지지 : 본성을 유지</text>
      <text x="52" y="554">– 본성 함양</text>
      <text x="262" y="446">왕도 : 덕을 통한 정치</text>
      <text x="262" y="470">교육 &gt; 선정 :</text>
      <text x="278" y="492">본성 회복을 위한</text>
      <text x="278" y="514">교육이 최우선</text>
    </g>
  </g>
</svg>
