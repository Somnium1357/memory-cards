<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="780" height="150">
  <style>
    text { font-family: "Noto Sans KR", sans-serif; font-size: 14px; fill: #333; }
    line, path, polyline { stroke: #666; fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .arrhead { fill: #666; stroke: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #dcdcdc !important; }
      line, path, polyline { stroke: #a8aebd !important; }
      .arrhead { fill: #a8aebd !important; }
    }
  </style>

  <!-- 사회 + 꺾쇠 -->
  <text x="18" y="73">사회</text>
  <path d="M56 68 L70 47"/>
  <path d="M56 68 L70 89"/>

  <!-- 윗줄: 종교 사슬 -->
  <text x="80" y="50">종교 → 성스러움 →</text>

  <!-- 아랫줄: 도덕 + 긴 화살표 -->
  <text x="80" y="95">도덕</text>
  <line x1="118" y1="90" x2="248" y2="90"/>
  <path class="arrhead" d="M248 90 L240 86.5 L240 93.5 Z"/>

  <!-- 두 사슬 꼬리를 묶는 대괄호 -->
  <path d="M266 32 L258 32 L258 102 L266 102"/>

  <!-- 괄호 뒤 사슬들 -->
  <text x="274" y="50">금기 → 의무 → 규율 정신</text>
  <text x="274" y="95">사랑 → 바람직 → 집단에 대한 애착</text>

  <!-- 도덕 밑 주석: 꺾어 내려가는 화살표 + 표현 -->
  <path d="M96 100 L96 126 L106 126"/>
  <path class="arrhead" d="M110 126 L102 122.5 L102 129.5 Z"/>
  <text x="118" y="131">표현 : 사회적 이해에 따른 동의 필요(신이 도덕의 근거 X) → 자율성(자기입법 X)</text>
</svg>
