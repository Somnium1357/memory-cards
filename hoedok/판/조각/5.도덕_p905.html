<h2>2022 개정 교육과정 - 교수·학습</h2>
<div class="ind">
<div class="prose"><p>초등학교 도덕과 교수·학습은 학생의 발달 수준에 맞게 도덕적 행위의 실천을 위한 가치나 태도를 강화하는 방향으로 나아가야 하며, 이를 위해 3~4학년군은 적절한 강화기제 활용을 통한 도덕적 가치·규범의 <span class="key">모방 및 수용</span>에, 5~6학년군은 도덕적 가치·규범의 <span class="key">자율적이고 합리적인 이해</span>에 역점을 둔다.</p><p>과정·기능에 기반한 도덕과 교수·학습 방법에서 3~4학년군은 <span class="key">단일</span>한 과정·기능에, 5~6학년군은 <span class="key">복합적</span>인 과정·기능에 역점을 두어 지도한다.</p></div>
</div>
