  <g fill="currentColor" font-size="16">
    <g text-anchor="middle">
      <text x="260" y="32">천 (=선을 향하니 선함)</text>
      <text x="260" y="74">성선 (사람 안에 천이 있으니 성도 선함)</text>
      <text x="260" y="116">불인인지심 (성선의 증거)</text>
      <text x="260" y="158">사단과 사덕</text>
      <text x="260" y="352">사단을 갖춰 사덕을 완성</text>
      <text x="140" y="410" font-weight="500">수양 (내적)</text>
      <text x="400" y="410" font-weight="500">정치 (외부)</text>
    </g>
    <text x="195" y="210">측은 → 인(사랑)</text>
    <text x="195" y="240">수오 → 의(정의)</text>
    <text x="195" y="270">사양 → 예(예의)</text>
    <text x="195" y="300">시비 → 지(지혜)</text>
    <text x="60" y="440">호연지기, 과욕</text>
    <text x="60" y="468">인의의 실현</text>
    <text x="82" y="496">상지 : 뜻을 고상하게 – 마음 보존</text>
    <text x="82" y="524">지지 : 본성을 유지 – 본성 함양</text>
    <text x="330" y="440">왕도 : 덕을 통한 정치</text>
    <text x="330" y="468">교육 &gt; 선정 : 본성 회복을 위한 교육이 최우선</text>
  </g>
