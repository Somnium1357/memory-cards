    <text x="284" y="216">인 <tspan font-size="14">(사랑)</tspan></text>
    <text x="284" y="248">의 <tspan font-size="14">(정의)</tspan></text>
    <text x="284" y="280">예 <tspan font-size="14">(예의)</tspan></text>
