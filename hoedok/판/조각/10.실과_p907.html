<h2>실과 교수·학습 방법 - 기술적 문제해결과정</h2>
<!-- 10-01 맞춤: 동하 「A : … 짝은 이름 굵게」·체크 15 — 평문 한 줄씩이던 모형 설명을 「이름 : 설명」(12자 이하 이름만 굵게 · 긴 구절은 보통 글꼴)으로, 단계는 레이블 + 세로 목록(설명 있으면) / 가로 사슬(설명 없으면) · 글자 무변 -->
<div class="ind">
<div class="stack">
<div><span class="term">기술적 문제</span> : <span class="desc">생활 속에서 겪는 불편함 또는 기존에 만들어진 제품의 결점</span></div>
<!-- 10-10 판 훑기 18: 형제 모형(문제해결·프로젝트·실습·실천적)과 같은 꼴 — 단계 레이블 + 세로 목록(좁은 칸에서 가로 흐름이 꺾이던 것) · 글자 무변 -->
<div class="branch">
  <div><span class="term">단계</span> <span class="quiet">(단계명 암기 O)</span></div>
  <div class="bracket">
    <div><span class="term">문제 확인</span></div>
    <div><span class="term">아이디어 탐색 및 구체화</span></div>
    <div><span class="term">실행</span></div>
    <div><span class="term">평가</span></div>
  </div>
</div>
</div>
