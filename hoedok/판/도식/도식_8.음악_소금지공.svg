<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 34 456 126" width="456" height="126">
  <!-- 판 도식 정본 형식: <style> 없음 · 색 전부 currentColor -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 관 (가로) -->
    <line x1="44" y1="60" x2="436" y2="60"/>
    <line x1="44" y1="92" x2="436" y2="92"/>
    <ellipse cx="44" cy="76" rx="8" ry="16"/>
    <ellipse cx="436" cy="76" rx="8" ry="16"/>
    <!-- 취구 -->
    <rect x="80" y="68" width="16" height="16"/>
    <!-- 지공 (취구 쪽부터 1~6) -->
    <circle cx="150" cy="76" r="6"/>
    <circle cx="190" cy="76" r="6"/>
    <circle cx="230" cy="76" r="6"/>
    <circle cx="290" cy="76" r="6"/>
    <circle cx="330" cy="76" r="6"/>
    <circle cx="370" cy="76" r="6"/>
    <!-- 칠성공 -->
    <circle cx="412" cy="76" r="6"/>
    <!-- 지시선 -->
    <line x1="88" y1="120" x2="88" y2="96"/>
    <line x1="412" y1="120" x2="412" y2="96"/>
  </g>
  <g fill="currentColor">
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(88,90) rotate(-90)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(412,90) rotate(-90)"/>
  </g>
  <g fill="currentColor" font-size="16" text-anchor="middle">
    <text x="150" y="52">1</text>
    <text x="190" y="52">2</text>
    <text x="230" y="52">3</text>
    <text x="290" y="52">4</text>
    <text x="330" y="52">5</text>
    <text x="370" y="52">6</text>
    <text x="88" y="140">취구</text>
    <text x="412" y="140">칠성공 <tspan font-size="13">(안씀)</tspan></text>
  </g>
</svg>
