<h2>미술 교육론 - 펠드만 - 미술 비평 지도과정</h2>
<div class="ind">
<div class="stack"><div class="desc">미술 비평 : 작품을 여러 관점으로 분석하고 감상</div>
<div class="desc">서술 (마음 열기) → 분석 (자세히 보기) → 해석 (작가의 마음 헤아리기) → 평가 (생각하고 판단하기)</div>
<div class="ind"><div class="desc">서술 : 전체적 느낌</div></div>
<div class="ind"><div class="desc">분석 : 조형 요소 → 작품 형식 ; 형식적 특성</div></div>
<div class="ind"><div class="desc">해석 : 작품의 의미 → 작가, 맥락, 의도 ; 내용적 특성</div></div>
<div class="ind"><div class="desc">평가 (= 판단) : 선호에 의한 판단</div></div></div>
</div>
