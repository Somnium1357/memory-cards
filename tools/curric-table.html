<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음악·미술 내체표</title>
<script>try{const t=localStorage.getItem('cards_theme_v1');if(t)document.documentElement.dataset.theme=(t==='c'?'light':'dark');}catch(e){}</script>
<style>
:root{--bg:#fbfaf7;--ink:#1d1d1b;--mute:#6b6862;--line:#d9d5cc;--card:#ffffff;--acc:#2f5d8a;--acc2:#8a4b2f;--hide:#f1eee7;--hint:#7a6a3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171716;--ink:#ecebe7;--mute:#a09c94;--line:#3a3834;--card:#201f1d;--acc:#8fb4db;--acc2:#e0a07e;--hide:#2a2926;--hint:#d6c48a}}
:root[data-theme="dark"]{--bg:#171716;--ink:#ecebe7;--mute:#a09c94;--line:#3a3834;--card:#201f1d;--acc:#8fb4db;--acc2:#e0a07e;--hide:#2a2926;--hint:#d6c48a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.88rem;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.bar button{font:inherit;font-size:.86rem;padding:6px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.bar button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
h2{font-size:1.1rem;margin:26px 0 6px;color:var(--acc)}
h3{font-size:.98rem;margin:18px 0 6px}
.note{color:var(--mute);font-size:.84rem;margin:2px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);margin:0 0 6px;table-layout:fixed}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;font-size:.9rem}
th{background:transparent;color:var(--mute);font-weight:600;font-size:.8rem;text-align:left}
td.k{width:84px;color:var(--mute);font-size:.8rem}
td.up{color:var(--hint);font-size:.8rem;width:22%}
td.c{cursor:pointer}
td.c.h{background:var(--hide);color:transparent}
td.c.h::selection{background:transparent}
td.nil{color:var(--mute);text-align:center}
.art th.g34{border-bottom:2px solid var(--acc)}
.art th.g56{border-bottom:2px solid var(--acc2)}
.tabs{display:flex;gap:6px;margin:0 0 4px}
@media (max-width:640px){th,td{font-size:.8rem;padding:5px}td.k{width:56px}td.up{display:none}}
@media print{.bar{display:none}body{background:#fff;color:#000}td.c.h{background:#fff;color:transparent}td.up.hp{color:transparent}}
</style>
</head>
<body>
<div class="wrap">
<h1>음악·미술 내체표</h1>
<p class="sub">2022 개정 · 책 내용 체계표 배치 그대로 · 항목을 누르면 가리기/보이기 · 위 버튼으로 한꺼번에.</p>

<div class="bar">
  <button data-sub="music" class="on">음악</button><button data-sub="art">미술</button>
  <span class="sep"></span>
  <button data-mode="show" class="on">전부 보기</button>
  <button data-mode="g56">5~6 가리기</button>
  <button data-mode="g34">3~4 가리기</button>
  <button data-mode="proc">과정·기능 가리기</button>
  <button data-mode="all">전부 가리기</button>
  <span class="sep"></span>
  <button onclick="window.print()">인쇄</button>
</div>

<section id="bookmusic"></section>
<section id="bookart" hidden></section>
</div>

<script>
/* 데이터 = 회독본 8.음악 552~ · 9.미술 768~ (09-23 기준) */
const MUSIC = {
  "연주": {
    "지식·이해": [["생활 속의 음악","간단한 악곡의 연주 형태","생활 → 악곡의 연주 형태"],["기초적인 음악 요소","음악 요소","공통(세 영역 같음)"],["자세와 주법","주법과 표현 기법","자세 → 표현 기법"],["느낌, 여러 소리","어울림, 여러 악기","소리 → 어울림·악기"]],
    "과정·기능": [["노래 부르거나 악기 연주하기","노래 부르거나 악기 연주하기","같음"],["신체로 표현하고 놀이하기","다양한 방법으로 표현하기","신체·놀이 → 다양한 방법"],["발표하고 이야기하기","발표하고 돌아보기","이야기 → 돌아보기"]],
    "가치·태도": [["연주를 즐기는 태도","음악으로 함께하는 태도","즐김 → 함께"],["연주에 대한 관심","연주 준비와 참여","관심 → 준비·참여"]]
  },
  "감상": {
    "지식·이해": [["다양한 종류의 음악","다양한 종류와 문화권의 음악","+ 문화권"],["지역의 음악 문화유산","우리나라 음악 문화유산","지역 → 우리나라"],["기초적인 음악 요소","음악 요소","공통"],["음악적 특징","음악적 특징, 음악의 간단한 구성","+ 간단한 구성"],["느낌, 분위기, 쓰임","느낌, 배경, 활용","분위기·쓰임 → 배경·활용"]],
    "과정·기능": [["반응하며 듣기","감지하며 듣기","반응 → 감지"],["탐색하고 발견하기","인식하고 구별하기","탐색·발견 → 인식·구별"],["묘사하거나 이야기하기","설명하기","묘사·이야기 → 설명"]],
    "가치·태도": [["소리와 음악을 즐기는 태도","음악의 아름다움에 대한 인식","즐김 → 아름다움 인식"],["음악에 대한 호기심","음악에 대한 공감","호기심 → 공감"]]
  },
  "창작": {
    "지식·이해": [["소리와 음악","간단한 음악","소리 → 간단한 음악"],["기초적인 음악 요소","음악 요소","공통"],["간단한 악보","기초적인 기보, 음악 매체","악보 → 기보·매체"],["느낌, 상상","느낌, 아이디어","상상 → 아이디어"]],
    "과정·기능": [["즉흥적으로 표현하기","떠올리며 표현하기","즉흥 → 떠올리며"],["부분적으로 바꾸기","간단한 조건에 따라 바꾸기","부분 → 조건"],["모방하여 나타내기","활용하여 만들기","모방 → 활용"]],
    "가치·태도": [["음악에 대한 흥미","음악에 대한 자신감","흥미 → 자신감"],["음악의 새로움을 즐기는 태도","음악에 대한 열린 태도","새로움 즐김 → 열린"]]
  }
};
/* 미술: 줄 = [지식·이해 3~4, 과정·기능 3~4, 지식·이해 5~6, 과정·기능 5~6, 단서] */
const ART = {
  "미적 체험": {
    rows: [["자신의 감각","감각을 활용하여 탐색하기","감각과 매체의 역할","감각과 매체를 활용하여 탐색하기","감각 → + 매체"],
           ["대상의 특징","대상에 반응하여 느낌과 생각을 나타내기","자신과 환경의 관계","대상과 상호 작용하며 의미 발견하기","반응 → 상호 작용"],
           ["생활 속 미술","미술의 특징과 역할을 발견하기","이미지와 의미","이미지를 해석하고 활용하기","생활 속 미술 → 이미지"]],
    val: [["미적 탐색에 대한 호기심","주변 환경에 대한 민감성","호기심 → 민감성"],["미술의 역할에 관한 관심","비판적으로 이해하는 태도","관심 → 비판적 이해"]]
  },
  "표현": {
    rows: [["표현 주제","관찰과 상상으로 아이디어를 떠올리기","표현 주제와 발상","다양한 방법으로 아이디어를 연결하기","떠올리기 → 연결하기"],
           ["기본적인 표현 재료와 용구","표현 방법을 익히기","표현 재료와 용구, 디지털 매체","표현 방법을 탐색하여 활용하기","익히기 → 탐색·활용 · + 디지털 매체"],
           ["조형 요소의 특징","의도를 가지고 작품을 제작하기","조형 요소와 원리의 관계","과정을 돌아보며 작품을 발전시키기","요소 → 요소와 원리 · 제작 → 발전"],
           [null,"타 교과와 관련짓기",null,"타 교과와 융합하기","관련 → 융합 (과정·기능만 4번째 칸)"]],
    val: [["표현에 대한 흥미","주제 표현의 의지","흥미 → 의지"],["자기 작품을 소중히 여기는 태도","자유롭게 시도하는 태도","소중히 → 자유롭게 시도"]]
  },
  "감상": {
    rows: [["미술 작품과 미술가","자세히 보고 질문하기","미술 작품의 배경","작품과 배경을 연결하기","작품·미술가 → 배경"],
           ["미술 작품의 특징","미술 작품에 관한 느낌과 생각을 설명하기","미술 작품의 내용과 형식","다양한 방법으로 분석하기","설명 → 분석"],
           ["미술 전시","미술 전시 및 행사에 참여하기","공동체의 미술 문화","미술 문화 활동을 경험하고 공유하기","전시 → 공동체 문화"]],
    val: [["자신의 감상 관점 존중","서로 다른 관점의 존중","자신 → 서로 다른"],["미술 문화에 관한 관심","공동체 문화에 참여","관심 → 참여"]]
  }
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cell = (t, g, cat) => t == null ? '<td class="nil">—</td>' : `<td class="c" data-g="${g}" data-cat="${cat}">${esc(t)}</td>`;

/* 책 그대로: 영역마다 표 하나 · 행 = 범주 · 열 = 3~4 / 5~6 · 칸 안 항목은 책 순서 */
function bookTable(area, cats){
  let h = `<h2>${area}</h2><table><tr><th style="width:84px">범주</th><th>3~4학년군</th><th>5~6학년군</th></tr>`;
  for (const [cat, list34, list56] of cats){
    const li = (xs, g) => xs.filter(x => x != null).map(x => `<div class="c" data-g="${g}" data-cat="${cat}" style="padding:2px 0">· ${esc(x)}</div>`).join('');
    h += `<tr><td class="k">${cat}</td><td>${li(list34,'34')}</td><td>${li(list56,'56')}</td></tr>`;
  }
  return h + '</table>';
}
function buildBook(){
  let m = '';
  for (const [area, cats] of Object.entries(MUSIC))
    m += bookTable(area, Object.entries(cats).map(([cat, rows]) => [cat, rows.map(r => r[0]), rows.map(r => r[1])]));
  document.getElementById('bookmusic').innerHTML = m;
  let a = '';
  for (const [area, d] of Object.entries(ART))
    a += bookTable(area, [["지식·이해", d.rows.map(r => r[0]), d.rows.map(r => r[2])], ["과정·기능", d.rows.map(r => r[1]), d.rows.map(r => r[3])], ["가치·태도", d.val.map(r => r[0]), d.val.map(r => r[1])]]);
  document.getElementById('bookart').innerHTML = a;
}
buildBook();
/* 음악 3~4 지식·이해의 공통 항목 중복 표시 방지: 책은 칸마다 그대로 적혀 있으므로 그대로 둔다 */
let sub = 'music', view = 'book';
function showSec(){ for (const id of ['bookmusic','bookart']) document.getElementById(id).hidden = true;
  document.getElementById('book' + sub).hidden = false; }
document.head.insertAdjacentHTML('beforeend', '<style>div.c{cursor:pointer}div.c.h{background:var(--hide);color:transparent;border-radius:4px}</style>');

let mode = 'show';
function apply(){
  document.querySelectorAll('td.c, div.c').forEach(td => {
    const g = td.dataset.g, cat = td.dataset.cat;
    const hide = mode === 'all' || (mode === 'g56' && g === '56') || (mode === 'g34' && g === '34') || (mode === 'proc' && cat === '과정·기능');
    td.classList.toggle('h', hide);
  });
}
document.addEventListener('click', e => {
  const td = e.target.closest('td.c, div.c'); if (td){ td.classList.toggle('h'); return; }
  const b = e.target.closest('.bar button'); if (!b) return;
  if (b.dataset.sub){ sub = b.dataset.sub; document.querySelectorAll('[data-sub]').forEach(x => x.classList.toggle('on', x === b)); showSec(); }
  if (b.dataset.view){ view = b.dataset.view; document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b)); showSec(); }
  if (b.dataset.mode){ mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b)); apply(); }
  if (b.hasAttribute('data-hint')){ const on = b.classList.toggle('on'); document.querySelectorAll('td.up').forEach(t => { t.style.visibility = on ? 'hidden' : ''; t.classList.toggle('hp', on); }); b.textContent = on ? '단서 보이기' : '단서 숨기기'; }
});
</script>
</body>
</html>
