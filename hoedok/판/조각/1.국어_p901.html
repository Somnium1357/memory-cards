<h2>2022 개정 교육과정 - 교육과정 문서 체제 (일러두기)</h2>
<div class="ind">
<div class="prose"><p>2022 개정 국어과 교육과정의 내용 요소 가운데 <span class="key">과정·기능</span>은 교과 고유의 사고 및 탐구 과정 또는 기능이다.</p><p><span class="key">성취기준 해설</span>: 해당 성취기준의 설정 취지 및 의미, 학습 의도 등 설명</p><p>성취기준 적용 시 <span class="key">고려 사항</span>: 영역 고유의 성격을 고려하여 특별히 강조하거나 중요하게 다루어야 할 교수·학습 및 평가의 주안점, 총론의 주요 사항과 해당 영역의 학습과의 연계 등 설명</p></div>
