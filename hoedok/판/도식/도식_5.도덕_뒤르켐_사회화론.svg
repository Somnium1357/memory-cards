<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 640 128" width="640" height="128">
  <!-- 10-01 맞춤(판 도덕): 동하 「뒤르켐 도식은 노트 보고 다시 그리든가」 → 백지인출 p7 손글씨 그대로 다시 그림.
       사회 ⟨ 종교 → 성스러움 → / 도덕 ——→ 두 화살이 한 괄호([)로 모여 → 금기 → 의무 → 규율 정신 / 사랑 → 바람직 → 집단에 대한 애착
       · 「표현」 = 아래 가지(도덕) 옆 작은 글씨 · 도덕 물결 밑줄에서 꺾인 화살 → 사회적 이해에 따른 동의 필요(…) → 자율성(…)
       · 화살표는 글자(→) 말고 선으로 — 판 kit 이 「A → B → C」 글줄을 span 으로 감싸 SVG <text> 안 글자가 사라지던 것(엔진 보고)
       · 판 도식 정본 형식: <style> 없음 · 색 전부 currentColor · 글자 16(본문과 비슷) -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 사회 ⟨ -->
    <path d="M62 44 L48 64 L62 84"/>
    <!-- 종교 → 성스러움 → -->
    <line x1="106" y1="44" x2="126" y2="44"/>
    <line x1="208" y1="44" x2="236" y2="44"/>
    <!-- 도덕 ——→ -->
    <line x1="106" y1="88" x2="236" y2="88"/>
    <!-- 괄호 [ (두 화살이 모이는 곳) -->
    <path d="M254 38 L246 38 L246 94 L254 94"/>
    <!-- 금기 → 의무 → 규율 정신 -->
    <line x1="298" y1="44" x2="322" y2="44"/>
    <line x1="382" y1="44" x2="406" y2="44"/>
    <!-- 사랑 → 바람직 → 집단에 대한 애착 -->
    <line x1="298" y1="88" x2="322" y2="88"/>
    <line x1="382" y1="88" x2="406" y2="88"/>
    <!-- 도덕 물결 밑줄 -->
    <path d="M70 100 q3 -3 6 0 t6 0 t6 0 t6 0 t6 0"/>
    <!-- 물결 밑줄에서 꺾여 → 설명 -->
    <path d="M85 102 L85 128 L112 128"/>
    <line x1="436" y1="128" x2="458" y2="128"/>
  </g>
  <g fill="currentColor">
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(66,40) rotate(-55)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(66,88) rotate(55)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(128,44)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(245,44)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(245,88)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(324,44)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(408,44)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(324,88)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(408,88)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(114,128)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(460,128)"/>
  </g>
  <g fill="currentColor" font-size="16">
    <text x="4" y="70">사회</text>
    <text x="72" y="50">종교</text>
    <text x="136" y="50">성스러움</text>
    <text x="72" y="94">도덕</text>
    <text x="30" y="112" font-size="13" opacity=".75">표현</text>
    <text x="262" y="50">금기</text>
    <text x="338" y="50">의무</text>
    <text x="416" y="50">규율 정신</text>
    <text x="262" y="94">사랑</text>
    <text x="330" y="94">바람직</text>
    <text x="416" y="94">집단에 대한 애착</text>
    <text x="120" y="134">사회적 이해에 따른 동의 필요(신이 도덕의 근거 X)</text>
    <text x="468" y="134">자율성(자기입법 X)</text>
  </g>
</svg>
