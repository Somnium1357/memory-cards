<h2>2022 개정 교육과정 - 교수·학습 방법</h2>
<div class="ind">
<div class="prose"><p>(다) 〈음악〉 과목의 교수·학습은 실음을 중심으로 질 높은 음향이 구현될 수 있도록 하며 최신의 디지털 음악실 환경을 구축하고, 인공지능, <span class="key">가상악기</span>, 메타버스 등을 활용한 <span class="key">실감형 음악 학습 콘텐츠</span>와 자료를 바탕으로 다양한 교수·학습이 실현될 수 있도록 한다. <span class="quiet" style="display:none">(구멍 10-04)</span></p></div>
</div>
