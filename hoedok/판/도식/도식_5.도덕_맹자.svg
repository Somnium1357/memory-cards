    <line x1="260" y1="82" x2="260" y2="98"/>
    <line x1="260" y1="124" x2="260" y2="140"/>
    <line x1="240" y1="164" x2="218" y2="182"/>
    <line x1="280" y1="164" x2="302" y2="182"/>
    <line x1="260" y1="304" x2="260" y2="326"/>
    <line x1="230" y1="362" x2="152" y2="388"/>
    <line x1="290" y1="362" x2="388" y2="388"/>
  </g>
  <g fill="currentColor">
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(260,58) rotate(90)"/>
    <path d="M0,0 L-9,-3.6 L-9,3.6 Z" transform="translate(260,100) rotate(90)"/>
