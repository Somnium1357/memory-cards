<h2>전통 공예</h2>
<!-- 09-30 완성: 입체와 공예 · 전통 공예 이음(옛 p05) -->

<h3><span class="num">4.</span> 도자기 공예</h3>
<!-- 09-30 맞춤: 종류·제작 과정·변천 = 칸 안 세 갈래(.r-in) — 전폭 칸에서 한 단으로 쌓여 오른쪽이 텅 비던 것을 갈래 단으로(체크리스트 9) ·
     변천은 단계마다 설명이 있어 세로 사슬(단계 | 설명 · 체크리스트 15 — 가로로 눕혀 설명이 줄 사이로 접히던 것) · 글자 무변(「:」는 표시만 끔) -->
<div class="r-in"><span class="term">종류</span></div>
<div class="ind">
<div class="bracket">
  <div><span class="term">토기</span> : <span class="desc">유약 X</span></div>
  <div><span class="term">도기</span> : <span class="desc">유약 O, 초벌O, 재벌X</span></div>
  <div><span class="term">자기</span> : <span class="desc">유약, 초벌, 재벌 O</span></div>
</div>
</div>

<div class="r-in"><span class="term">제작 과정</span></div>
<div class="ind">
<!-- 10-10 판 훑기 17: 여덟 단계 가로 흐름이 칸 폭에서 꺾여 「→」 뒤 「재벌」만 다음 줄 → 형제(변천)와 같은 세로 사슬(keepv) -->
<div class="vchain keepv">
  <div class="stp"><span class="term">반죽</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">성형</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">건조</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">무늬</span> <span class="quiet">(새기기)</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">초벌</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">무늬</span> <span class="quiet">(그리기)</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">유약</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">재벌</span></div>
</div>
<div class="sub" style="margin-top:9px"><span class="term">방법</span> : <span class="desc">핀칭(빚기), 흙가래 만들기, 판, 틀, 속파기</span></div>
</div>

<!-- 10-01 맞춤: 갈래 머리(r-in)의 인라인 윗여백 14px 이 둘째 단 첫머리에서도 남아 「변천」이 옆 단 「종류」보다 내려앉았다(체크리스트 13) → 인라인 여백 뺌(갈래 사이 간격은 kit 이 준다) -->
<div class="r-in"><span class="term">변천</span></div>
<div class="ind">
<div class="vchain">
  <div class="stp"><span class="term">토기</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">청자</span></div><div class="ann"><span class="mk">:</span> <span class="desc">푸른빛 <span class="quiet">(상감 기법)</span></span></div><!-- 10-10 판 훑기 29: 「푸른빛, (상감 기법)」 남는 쉼표 -->
  <div class="arw">↓</div>
  <div class="stp"><span class="term">분청사기</span></div><div class="ann"><span class="mk">:</span> <span class="desc">안쪽 회색, 바깥쪽 흰색 흙</span></div>
  <div class="arw">↓</div>
  <div class="stp"><span class="term">백자</span></div><div class="ann"><span class="mk">:</span> <span class="desc">처음부터 흰색 고령토</span></div>
</div>

<div class="row" style="margin-top:14px"><span class="mk">⟶</span><div class="bracket">
  <div><span class="term">상감</span> : <span class="desc">무늬 파내고 다른 색 흙</span></div>
  <div><span class="term">청화</span> : <span class="desc">청색 안료</span></div>
  <div><span class="term">철화</span> : <span class="desc">철 성분<span class="quiet">(검붉은 색)</span> 안료</span></div>
</div></div>
</div>
