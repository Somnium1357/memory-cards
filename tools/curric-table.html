.wrap{max-width:1100px;margin:0 auto;padding:40px 20px 60px}

.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;font-weight:500;border:0;background:var(--fill);color:var(--label);padding:7px 13px;border-radius:999px;cursor:pointer;min-height:34px}

h3{font-size:17px;line-height:22px;font-weight:600;margin:0;padding:14px 0 6px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:6px 20px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:13px;line-height:18px;font-weight:600;color:var(--sec);text-align:left;padding:12px 10px 8px;border-bottom:.5px solid var(--sep)}
td{padding:10px;vertical-align:top;border-bottom:.5px solid var(--sep)}

th:first-child{padding-left:0}
td.k2{font-weight:600;padding-left:0}
.it{padding:1px 0}
.c{cursor:pointer;border-radius:6px;transition:background .12s,color .12s}
.c.h{background:var(--fill);color:transparent}

.nil{color:var(--ter)}

    "표현": [["기본 움직임의 기초 표현", [["이동 움직임 표현","워킹, 점핑, 호핑, 스키핑, 갤러핑, 리핑, 슬라이딩 등"],["비이동 움직임 표현","펴기, 접기, 비틀기, 제자리 돌기, 털기, 흔들기 등"],["조작 움직임 표현","들기, 돌리기 등"]]],
            ["기본 움직임의 표현 방법", [["추상 표현","언어 표현, 느낌이나 생각 표현하기 등"],["모방 표현","사물 표현, 인물 표현, 자연 현상 표현하기 등"],["리듬 표현","박자, 강약, 빠르기, 패턴에 따라 표현하기 등"],["도구 표현","줄, 공, 천, 훌라후프 등을 활용하여 표현하기 등"]]]]
  },
  "56": {
    "운동": [["건강 체력 및 운동 체력", [["건강체력 관련 운동","근력, 근지구력, 심폐지구력, 유연성 운동 등"],["운동체력 관련 운동","순발력, 민첩성, 평형성, 협응성 운동 등"]]],
            ["성장 및 안전 활동", [["성장 관련 활동","신체 변화 및 제2차 성징 이해 활동, 감정 수용 및 조절 활동, 관계 형성 활동, 성 건강 활동 등"],["안전 활동","운동 관련 안전사고 예방 및 대처 활동, 생활 안전사고 예방 및 대처 활동, 자연환경 변화 대처 활동 등"]]]],
    "스포츠": [["기술형 스포츠 유형별 활동", [["기록형","육상 활동, 경영 활동, 빙상 활동, 표적 활동 등"],["동작형","매트 활동, 뜀틀 활동, 평균대 활동 등"],["투기형","태권도 활동, 씨름 활동 등"]]],
              ["전략형 스포츠 유형별 활동", [["영역형","축구형 게임, 농구형 게임, 핸드볼형 게임, 럭비형 게임, 하키형 게임 등"],["필드형","야구형 게임 등"],["네트형","배구형 게임, 배드민턴형 게임, 족구형 게임, 탁구형 게임, 테니스형 게임 등"]]],
              ["생태형 스포츠 유형별 활동", [["생활환경형","골프형 활동, 플라잉디스크형 활동, 자전거타기형 활동, 인라인스케이팅 활동, 스포츠클라이밍 활동, 민속놀이 등"],["자연환경형","오리엔티어링, 등산 활동, 캠핑 활동, 수상 활동, 설상 활동, 승마 활동 등"]]]],
    "표현": [["스포츠 표현 활동", [[null,"창작체조 활동, 음악줄넘기 활동 등"]]],
            ["전통 표현 활동", [[null,"우리나라의 민속무용 활동, 외국의 민속무용 활동 등"]]],
            ["현대 표현 활동", [[null,"라인댄스 활동, 댄스스포츠 활동, 스트리트댄스 활동 등"]]]]
  }
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const it = (x, g, cat) => `<div class="it c" data-g="${g}" data-cat="${cat}">${esc(x)}</div>`;

/* 책 그대로: 영역마다 표 하나 · 행 = 범주 · 열 = 3~4 / 5~6 · 칸 안 항목은 책 순서 */
function bookTable(area, cats){
  let h = `<h2>${esc(area)}</h2><div class="card"><table><tr><th style="width:88px">범주</th><th>3~4학년군</th><th>5~6학년군</th></tr>`;
  for (const [cat, list34, list56] of cats){
    const li = (xs, g) => xs.filter(x => x != null).map(x => it(x, g, cat)).join('');
    h += `<tr><td class="k">${cat}</td><td>${li(list34,'34')}</td><td>${li(list56,'56')}</td></tr>`;
  }
  return h + '</table></div>';
}
function peVal(){
  let h = `<h2>가치·태도 내용 요소</h2><div class="card"><table><tr><th style="width:88px">영역</th><th>3~4학년군</th><th>5~6학년군</th></tr>`;
  for (const [area, [a, b]] of Object.entries(PE_VAL))
    h += `<tr><td class="k">${area}</td><td>${a.map(x => it(x,'34','가치·태도')).join('')}</td><td>${b.map(x => it(x,'56','가치·태도')).join('')}</td></tr>`;
  return h + '</table></div>';
}
function peEx(g){
  let h = `<h2>신체활동 예시 <small>${g === '34' ? '초등학교 3~4학년군' : '초등학교 5~6학년군'}</small></h2><div class="card">`;
  for (const [area, subs] of Object.entries(PE_EX[g])){
    h += `<h3>${area}</h3><table><tr><th style="width:24%">세부 영역</th><th style="width:24%">하위</th><th>예시</th></tr>`;
    for (const [sub, rows] of subs){
      rows.forEach(([lo, ex], i) => {
        h += '<tr>' + (i === 0 ? `<td class="k2" rowspan="${rows.length}">${it(sub, g, '세부')}</td>` : '')
          + (lo == null ? `<td class="nil">—</td>` : `<td>${it(lo, g, '하위')}</td>`)
          + `<td>${it(ex, g, '예시')}</td></tr>`;
      });
    }
    h += '</table>';
  }
  return h + '</div>';
}
function buildBook(){
  let m = '';
  for (const [area, cats] of Object.entries(MUSIC))
    m += bookTable(area, Object.entries(cats).map(([cat, rows]) => [cat, rows.map(r => r[0]), rows.map(r => r[1])]));
  document.getElementById('bookmusic').innerHTML = m;
  let a = '';
  for (const [area, d] of Object.entries(ART))
    a += bookTable(area, [["지식·이해", d.rows.map(r => r[0]), d.rows.map(r => r[2])], ["과정·기능", d.rows.map(r => r[1]), d.rows.map(r => r[3])], ["가치·태도", d.val.map(r => r[0]), d.val.map(r => r[1])]]);
  document.getElementById('bookart').innerHTML = a;
  document.getElementById('bookpe').innerHTML = peVal() + peEx('34') + peEx('56');
}
buildBook();

let sub = 'music', mode = 'show';
function setMode(m){ mode = m; document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === m)); apply(); }
function showSec(){
  for (const id of ['bookmusic','bookart','bookpe']) document.getElementById(id).hidden = true;
  document.getElementById('book' + sub).hidden = false;
  /* 체육엔 과정·기능이 없고 예시가 있다 — 단추를 바꿔 끼운다 */
  document.querySelector('[data-mode="proc"]').hidden = (sub === 'pe');
  document.querySelector('[data-mode="ex"]').hidden = (sub !== 'pe');
  if ((sub === 'pe' && mode === 'proc') || (sub !== 'pe' && mode === 'ex')) setMode('show');
}
function apply(){
  document.querySelectorAll('.c').forEach(el => {
    const g = el.dataset.g, cat = el.dataset.cat;
    const hide = mode === 'all' || (mode === 'g56' && g === '56') || (mode === 'g34' && g === '34')
      || (mode === 'proc' && cat === '과정·기능') || (mode === 'ex' && cat === '예시');
    el.classList.toggle('h', hide);
  });
}
document.addEventListener('click', e => {
  const c = e.target.closest('.c'); if (c){ c.classList.toggle('h'); return; }
  const b = e.target.closest('.bar button'); if (!b) return;
  if (b.dataset.sub){ sub = b.dataset.sub; document.querySelectorAll('[data-sub]').forEach(x => x.classList.toggle('on', x === b)); showSec(); }
  if (b.dataset.mode) setMode(b.dataset.mode);
});
/* 주소 끝 #music · #art · #pe 로 과목을 골라 연다 */
{ const h = location.hash.slice(1); const b = document.querySelector(`[data-sub="${h}"]`); if (b) b.click(); }
/* 앱이 다른 곳에서 테마를 바꾸면 따라 바뀐다 */
window.addEventListener('storage', e => { if (!e.key || /^cards_(theme|light)_v1$/.test(e.key)) {
  try{ let t = localStorage.getItem('cards_theme_v1'), l = localStorage.getItem('cards_light_v1'); t = t==='b'?'dark':t==='c'?'paper':t;
    const r = document.documentElement; if (['white','paper','dark'].includes(t)) r.dataset.theme = t; else r.removeAttribute('data-theme');
    if (['white','paper'].includes(l)) r.dataset.light = l; else r.removeAttribute('data-light'); }catch(_){} } });
</script>
