<h2>5~6학년군 표현 - 표현 활동의 유형</h2>
<div class="ind">
<div class="stack"><div class="desc">스포츠 표현 : 예술적인 신체 표현을 바탕으로 스포츠 기능을 겨루는</div>
<div class="desc">전통 표현 : 민족 고유의 역사, 사상, 풍습이 담긴 무용</div>
<div class="desc">현대 표현 : 새로운 감각으로 자유롭고 창의적으로 표현</div>
<div class="desc">평가</div></div>
<div class="prose"><p>	- 스포츠 표현 : 움직임 기술의 수행 + 심미적 표현 능력</p><p>	- 전통 표현 : 표현에 담긴 문화적 특성을 이해하고 동작을 구성하여 발표하는 능력</p><p>	- 현대 표현 : 타인의 작품을 공감하고 자신의 생각과 감정을 자유롭게 표현하며 감상하는 능력</p></div>
