<h3>성격</h3>
<div class="ind">
<div class="prose"><p>‘기술’은 학문 구조 측면에서 ‘기술학적 지식’, 교육 목표 측면에서 ‘<span class="key">기술적 소양</span>’, 교육의 방법 측면에서 ‘기술적 문제해결’, 그리고 진로 교육의 측면에서 ‘<span class="key">기술 진로 탐색</span>’의 성격을 가진다.</p><p>실과의 ‘디지털 사회와 인공지능’ 영역은 중학교 1~3학년 정보 교과와 연계되어 변화하는 세상을 인식하고 <span class="key">컴퓨팅 사고</span>를 바탕으로 인공지능을 활용한 실생활 문제 해결 역량 함양을 지향한다.</p></div>
